<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>超载四模块 · 交互动效演示</title>
  <style>
    :root {
      --bg: #100e0d;
      --ink: #f2ebe3;
      --mute: #9a8f86;
      --clay: #ff6b4a;
      --sage: #a8bfb0;
      --sand: #e8d5c4;
      --panel: #1a1614;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #2a1c18 0%, var(--bg) 55%);
      color: var(--ink);
    }
    header {
      padding: 1rem 1.25rem 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    .hint { color: var(--mute); font-size: 0.8rem; max-width: 36rem; line-height: 1.45; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      padding: 0.5rem 1.25rem;
    }
    .tabs button {
      appearance: none; border: 1px solid #3a302c; background: var(--panel);
      color: var(--ink); border-radius: 999px; padding: 0.4rem 0.85rem;
      font-size: 0.78rem; cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
      border-color: var(--clay); background: #2a1a16; color: #ffd2c4;
    }
    .stage-wrap {
      margin: 0.5rem 1.25rem 1rem;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #2e2622;
      background: #0c0a09;
      position: relative;
      aspect-ratio: 16 / 10;
      max-height: min(62vh, 560px);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute; inset: auto 0 0 0;
      padding: 1rem 1.1rem 1.15rem;
      background: linear-gradient(transparent, rgba(8,6,5,0.88) 35%);
      pointer-events: none;
    }
    .phase { font-size: 0.72rem; color: var(--sage); letter-spacing: 0.04em; text-transform: none; }
    .cue { font-size: 1.05rem; margin-top: 0.25rem; line-height: 1.35; min-height: 2.6em; }
    .meta { font-size: 0.72rem; color: var(--mute); margin-top: 0.35rem; }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem 1.25rem;
      padding: 0 1.25rem 1.5rem;
    }
    .controls label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.72rem; color: var(--mute); }
    .controls input[type="range"] { width: 100%; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .row button, .row select {
      appearance: none; border: 1px solid #3a302c; background: var(--panel);
      color: var(--ink); border-radius: 10px; padding: 0.45rem 0.8rem; font-size: 0.8rem; cursor: pointer;
    }
    .row button.primary { border-color: var(--clay); background: #3a1f18; }
    .legend {
      padding: 0 1.25rem 2rem;
      color: var(--mute); font-size: 0.75rem; line-height: 1.5;
    }
    .legend strong { color: #d8cfc6; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>大脑超载 · 四模块交互动效演示</h1>
      <p class="hint">协议钟驱动节奏；滑条只改画面品质（标签密度 / 场空 / 清晰 / 门远近）。口播短句与画面事件对齐。加速便于验收，真机按 1×。</p>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="stage-wrap">
    <canvas id="c"></canvas>
    <div class="overlay">
      <div class="phase" id="phase">—</div>
      <div class="cue" id="cue">选择模块后按播放</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <button class="primary" id="play" type="button">播放</button>
      <button id="reset" type="button">重置</button>
      <label style="flex-direction:row;align-items:center;gap:0.4rem;color:var(--mute);font-size:0.78rem;">
        速度
        <select id="speed">
          <option value="8">演示 8×</option>
          <option value="4">4×</option>
          <option value="1">真机 1×</option>
        </select>
      </label>
    </div>
    <label>唤醒 arousal <span id="aVal">72</span>
      <input id="arousal" type="range" min="0" max="100" value="72" />
    </label>
    <label>专注 focus <span id="fVal">55</span>
      <input id="focus" type="range" min="0" max="100" value="55" />
    </label>
    <label>平静 calm <span id="cVal">38</span>
      <input id="calm" type="range" min="0" max="100" value="38" />
    </label>
  </div>

  <p class="legend">
    <strong>意义匹配：</strong>
    楼梯＝一样样落地 · 双圆＝紧松对照 · 三角＝聚停泄 · 门洞＝可回之岛。
    规格见 <code>interactive-motion.md</code>。本页不写进产品运行时。
  </p>

<script>
(() => {
  const CLAY = [255, 107, 74];
  const SAGE = [168, 191, 176];
  const SAND = [232, 213, 196];

  const MODULES = [
    {
      id: "grounding-54321",
      name: "感官着陆 · 楼梯",
      kind: "ground-stairs",
      durationSec: 300,
      phases: [
        { name: "看 · 5", start: 0, end: 60, stair: 5,
          cues: [
            { at: 12, text: "第一样。看见它。" },
            { at: 24, text: "第二样。" },
            { at: 36, text: "第三样。不用挑好看的。" },
            { at: 48, text: "第四样。" },
            { at: 56, text: "第五样。它们都在这儿。你也在这儿。" },
          ]},
        { name: "触 · 4", start: 60, end: 120, stair: 4,
          cues: [
            { at: 10, text: "衣料。指尖碰一碰也行。" },
            { at: 25, text: "桌面，或椅子的扶手。" },
            { at: 40, text: "脚底。你踩着的地方，接住你。" },
            { at: 52, text: "手心。热的或凉的，都算。" },
          ]},
        { name: "听 · 3", start: 120, end: 180, stair: 3,
          cues: [
            { at: 12, text: "第一种声音。" },
            { at: 32, text: "再远一点的。" },
            { at: 50, text: "呼吸，也可以是第三种。" },
          ]},
        { name: "嗅 · 2 + 长呼", start: 180, end: 300, stair: 2,
          cues: [
            { at: 20, text: "第一种气味。哪怕几乎没有。" },
            { at: 50, text: "第二种。记忆里的，也算。" },
            { at: 80, text: "现在，只做一次很长的呼气。把气慢慢放完。" },
            { at: 100, text: "标签可以先关上。你在这张椅子上。" },
            { at: 115, text: "五个窗口，我们一个都没开。这样就够了。" },
          ]},
      ],
    },
    {
      id: "pmr-release",
      name: "PMR · 紧松双圆",
      kind: "tense-release-discs",
      durationSec: 720,
      phases: [
        { name: "安顿", start: 0, end: 120, body: null,
          cues: [
            { at: 30, text: "只用七成力。不要憋气。" },
            { at: 70, text: "等一下我会数五下。松开的那一下，才是练习。" },
          ]},
        { name: "紧–松循环", start: 120, end: 600, body: "cycle",
          cues: [
            { at: 0, text: "手。握紧——五、四、三、二、一。松开。让热流散开。" },
            { at: 80, text: "小臂。同样，七成力。绷紧——松开。" },
            { at: 160, text: "肩膀。耸一下，然后放下来。" },
            { at: 240, text: "脸。轻轻皱一下，再松开下巴。" },
            { at: 320, text: "腹部。微微收，再交给椅背。" },
            { at: 400, text: "腿。脚尖绷一下，再像陷进地板。" },
          ]},
        { name: "整体沉静", start: 600, end: 720, body: "rest",
          cues: [
            { at: 40, text: "不用评价。差别本身，就够了。" },
            { at: 80, text: "窗口还在外面。身体，已经先落地了一寸。" },
          ]},
      ],
    },
    {
      id: "breath-478",
      name: "4-7-8 · 泄光三角",
      kind: "exhale-triangle",
      durationSec: 480,
      phases: [
        { name: "安顿", start: 0, end: 60, breath: "settle",
          cues: [
            { at: 20, text: "呼干净。空一点，没关系。" },
            { at: 35, text: "先别管窗口。把身上的热，交给这一次呼气。" },
            { at: 48, text: "下面我们数：四、七、八。乱了，就从下一次吸气重新开始。" },
          ]},
        { name: "4-7-8 循环", start: 60, end: 420, breath: "478",
          cues: [
            { at: 3, text: "吸，二，三，四。" },
            { at: 8, text: "停……让它停在身体里。" },
            { at: 16, text: "呼——把气从嘴角轻轻漏出去。" },
            { at: 40, text: "你只跟呼气走。" },
            { at: 120, text: "呼气，可以再长一点点。" },
            { at: 240, text: "标签上的热，跟着呼气往下走。" },
          ]},
        { name: "自然呼吸", start: 420, end: 480, breath: "natural",
          cues: [
            { at: 25, text: "不用再数。气自己会来。" },
            { at: 45, text: "心跳如果慢了一点，就让它慢。" },
          ]},
      ],
    },
    {
      id: "imagery-safeplace",
      name: "安全岛 · 门洞",
      kind: "safe-portal",
      durationSec: 720,
      phases: [
        { name: "放松诱导", start: 0, end: 180, portal: "approach",
          cues: [
            { at: 20, text: "第一次呼气。背包带，松一扣。" },
            { at: 70, text: "第二次。肩再低一点。" },
            { at: 120, text: "第三次。把脸上的用力，也呼出去。" },
            { at: 150, text: "门会在左边等你。你不用跑。" },
          ]},
        { name: "场景建构", start: 180, end: 600, portal: "build",
          cues: [
            { at: 30, text: "先定光线。亮一点，或暗一点，都可以。" },
            { at: 90, text: "空气是凉的，还是暖的。让皮肤告诉你。" },
            { at: 160, text: "远处有没有一种声音。很远也行。" },
            { at: 230, text: "脚下踩着什么。" },
            { at: 300, text: "如果有一个气味，很淡，也可以留下。" },
            { at: 360, text: "没有人能进来。窗口不在这里。你只是待着。" },
          ]},
        { name: "锚定返回", start: 600, end: 720, portal: "anchor",
          cues: [
            { at: 35, text: "手在心口。门还在。" },
            { at: 70, text: "动一动手指。脚尖。" },
            { at: 100, text: "睁开眼。房间还在。你可以晚一点再开窗口。" },
          ]},
      ],
    },
  ];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const elPhase = document.getElementById("phase");
  const elCue = document.getElementById("cue");
  const elMeta = document.getElementById("meta");
  const tabs = document.getElementById("tabs");

  let modIndex = 0;
  let playing = false;
  let t0 = 0;
  let elapsed = 0;
  let lastFrame = 0;
  let pulse = 0;

  const bio = () => ({
    a: +document.getElementById("arousal").value / 100,
    f: +document.getElementById("focus").value / 100,
    c: +document.getElementById("calm").value / 100,
  });
  const speed = () => +document.getElementById("speed").value;

  function fit() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fit);

  MODULES.forEach((m, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = m.name;
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.addEventListener("click", () => {
      modIndex = i;
      [...tabs.children].forEach((x, j) => x.setAttribute("aria-selected", j === i ? "true" : "false"));
      reset();
    });
    tabs.appendChild(b);
  });

  ["arousal", "focus", "calm"].forEach((id) => {
    const input = document.getElementById(id);
    const span = document.getElementById(id[0] + "Val");
    input.addEventListener("input", () => { span.textContent = input.value; });
  });

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function currentPhase(mod, t) {
    return mod.phases.find((p) => t >= p.start && t < p.end) || mod.phases[mod.phases.length - 1];
  }

  function currentCue(phase, t) {
    const local = t - phase.start;
    let text = "…";
    let hit = null;
    for (const c of phase.cues || []) {
      if (local >= c.at) { text = c.text; hit = c; }
    }
    return { text, local, hit };
  }

  function drawTabs(w, h, count, alpha) {
    const { a } = bio();
    const n = Math.round(4 + a * 10);
    for (let i = 0; i < n; i++) {
      const x = (i * 97 + pulse * 30) % (w + 40) - 20;
      const y = 18 + (i * 37) % (h * 0.45);
      ctx.fillStyle = `rgba(255,107,74,${0.06 + a * 0.1 * alpha})`;
      ctx.fillRect(x, y, 46 + (i % 3) * 12, 10);
      ctx.fillStyle = `rgba(255,200,180,${0.08 * alpha})`;
      ctx.fillRect(x + 6, y + 2, 18, 3);
    }
  }

  function drawStairs(w, h, t, phase) {
    const { a, f, c } = bio();
    ctx.fillStyle = `rgb(${20 + c * 8},${16 + c * 14},${14 + c * 10})`;
    ctx.fillRect(0, 0, w, h);
    drawTabs(w, h, 12, Math.max(0.15, 1 - phase.start / 280));

    const local = t - phase.start;
    const cueHits = (phase.cues || []).filter((x) => local >= x.at).length;
    const levels = [5, 4, 3, 2, 1];
    const active = phase.stair || 5;
    const soft = phase.stair === 3;
    const thick = phase.stair === 4;
    const foot = phase.name.includes("触") && local >= 40 && local < 52;

    levels.forEach((lv, i) => {
      const done = lv > active || (lv === active && cueHits > 0);
      const isActive = lv === active || (active === 2 && lv === 1 && local >= 80);
      const bw = w * (0.22 + lv * 0.09);
      const bh = h * 0.07;
      const x = w * 0.12 + i * w * 0.1;
      const y = h * 0.22 + i * h * 0.11 + (foot && isActive ? 4 : 0);
      const clarity = isActive ? 0.35 + f * 0.55 : done ? 0.22 + c * 0.2 : 0.1;
      const r = Math.round(CLAY[0] * (isActive ? 1 : 0.55) + SAGE[0] * c * 0.2);
      const g = Math.round(CLAY[1] * (isActive ? 1 : 0.55) + SAGE[1] * c * 0.35);
      const b = Math.round(CLAY[2] * (isActive ? 1 : 0.55) + SAGE[2] * c * 0.25);
      ctx.beginPath();
      const rad = soft && isActive ? 16 : 6;
      roundRect(x, y, bw, bh * (thick && isActive ? 1.35 : 1), rad);
      ctx.fillStyle = `rgba(${r},${g},${b},${clarity})`;
      ctx.fill();
      if (isActive) {
        for (let k = 0; k < Math.min(cueHits, 5); k++) {
          ctx.beginPath();
          ctx.arc(x + 18 + k * 16, y + bh * 0.5, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,240,230,${0.55 + f * 0.35})`;
          ctx.fill();
        }
      }
    });

    // long exhale settle
    if (phase.name.includes("嗅") && local >= 80) {
      const ex = Math.min(1, (local - 80) / 25);
      ctx.fillStyle = `rgba(${SAGE[0]},${SAGE[1]},${SAGE[2]},${0.05 + ex * 0.12 * c})`;
      ctx.fillRect(0, h * (0.55 + ex * 0.1), w, h);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPMR(w, h, t, phase) {
    const { a, f, c } = bio();
    ctx.fillStyle = `rgb(${22},${14 + c * 8},${12})`;
    ctx.fillRect(0, 0, w, h);
    const cx = w * 0.5;
    const cy = h * 0.46;

    let tense = 0;
    let release = 0;
    if (phase.body === "cycle") {
      const local = (t - phase.start) % 13;
      if (local < 5) tense = local / 5;
      else release = (local - 5) / 8;
    } else if (phase.body === "rest") {
      release = 0.85;
    } else {
      tense = 0.15 + 0.05 * Math.sin(pulse * 2);
    }

    // small clay disc
    const sr = 18 + (1 - tense) * 10 - tense * 8;
    ctx.beginPath();
    ctx.arc(cx - 70, cy, sr * (0.85 + a * 0.2), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${CLAY[0]},${CLAY[1]},${CLAY[2]},${0.25 + tense * 0.55 + a * 0.1})`;
    ctx.fill();

    // large sand disc
    const lr = 30 + release * (70 + c * 40);
    ctx.beginPath();
    ctx.arc(cx + 40, cy, lr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${SAND[0]},${SAND[1]},${SAND[2]},${0.12 + release * (0.35 + c * 0.35)})`;
    ctx.fill();

    if (f > 0.4) {
      ctx.strokeStyle = `rgba(255,220,200,${0.15 + f * 0.35})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx - 70, cy, sr + 6, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawTriangle(w, h, t, phase) {
    const { a, f, c } = bio();
    ctx.fillStyle = `rgb(${20},${16},${18 + c * 6})`;
    ctx.fillRect(0, 0, w, h);

    let mode = "idle";
    let k = 0;
    if (phase.breath === "settle") {
      mode = "exhale";
      k = Math.min(1, (t - phase.start) / 25);
    } else if (phase.breath === "478") {
      const cycle = (t - phase.start) % 19;
      if (cycle < 4) { mode = "inhale"; k = cycle / 4; }
      else if (cycle < 11) { mode = "hold"; k = (cycle - 4) / 7; }
      else { mode = "exhale"; k = (cycle - 11) / 8; }
    } else {
      mode = "natural";
      k = 0.5 + 0.5 * Math.sin(pulse * 0.8);
    }

    const dustN = Math.round(6 + a * 18);
    for (let i = 0; i < dustN; i++) {
      const fall = mode === "exhale" ? k * 40 : 0;
      const x = (i * 53 + pulse * 20) % w;
      const y = ((i * 29) % (h * 0.5)) + fall;
      ctx.fillStyle = `rgba(255,107,74,${0.08 + a * 0.12})`;
      ctx.fillRect(x, y, 10, 4);
    }

    const cx = w / 2;
    const cy = h * 0.42;
    let scale = 1;
    let open = 0.55;
    if (mode === "inhale") { scale = 0.75 + k * 0.35; open = 0.35 + k * 0.1; }
    if (mode === "hold") { scale = 1.05; open = 0.42; }
    if (mode === "exhale") { scale = 1.05 - k * 0.35; open = 0.45 + k * 0.4; }
    if (mode === "natural") { scale = 0.85 + k * 0.08; open = 0.5; }

    const size = Math.min(w, h) * 0.28 * scale;
    ctx.beginPath();
    ctx.moveTo(cx, cy - size * 0.7);
    ctx.lineTo(cx + size * open, cy + size * 0.55);
    ctx.lineTo(cx - size * open, cy + size * 0.55);
    ctx.closePath();
    const alpha = 0.2 + f * 0.25 + (mode === "exhale" ? k * 0.2 : 0);
    ctx.fillStyle = `rgba(${SAGE[0]},${SAGE[1]},${CLAY[2]},${alpha})`;
    ctx.fill();

    if (mode === "exhale") {
      const g = ctx.createLinearGradient(cx, cy, cx, cy + size * 1.2);
      g.addColorStop(0, `rgba(${SAGE[0]},${SAGE[1]},${SAGE[2]},${0.25 * k})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(cx - size, cy, size * 2, size * 1.4);
    }
  }

  function drawPortal(w, h, t, phase) {
    const { a, f, c } = bio();
    ctx.fillStyle = `rgb(${36 - c * 4},${28},${26})`;
    ctx.fillRect(0, 0, w, h);

    // outer tabs pushed away in build
    const push = phase.portal === "build" ? 1 : phase.portal === "anchor" ? 0.7 : 0.2;
    drawTabs(w * (1 - push * 0.5), h, 8, 1 - push * 0.7);

    const local = t - phase.start;
    let near = 0.25 + c * 0.55 - a * 0.35;
    let warmth = 0.3 + c * 0.5;
    let clarity = 0.2 + f * 0.55;
    if (phase.portal === "approach") {
      near = 0.15 + Math.min(1, local / 150) * (0.35 + c * 0.3);
      warmth = 0.25 + Math.min(1, local / 150) * 0.4;
    } else if (phase.portal === "build") {
      near = 0.45 + c * 0.35 - a * 0.2;
      clarity = 0.25 + Math.min(1, local / 300) * (0.4 + f * 0.35);
      warmth = 0.4 + c * 0.4;
    } else {
      near = 0.5 + c * 0.25;
      clarity = 0.45 + f * 0.3;
    }

    const doorW = w * (0.18 + near * 0.12);
    const doorH = h * (0.42 + near * 0.18);
    const dx = w * (0.14 + (1 - near) * 0.08);
    const dy = h * 0.28;

    ctx.fillStyle = `rgba(232,201,181,${0.12 + warmth * 0.35})`;
    roundRect(dx, dy, doorW, doorH, doorW * 0.45);
    ctx.fill();

    // inner field blocks (no landscape)
    const blocks = 3 + Math.floor(clarity * 3);
    for (let i = 0; i < blocks; i++) {
      const bx = dx + doorW * 0.18;
      const by = dy + doorH * (0.2 + i * 0.18);
      ctx.fillStyle = `rgba(${180 + i * 15},${140 + i * 10},${120},${0.1 + clarity * 0.35})`;
      ctx.fillRect(bx, by, doorW * 0.55, doorH * 0.1);
    }

    if (phase.portal === "anchor") {
      ctx.beginPath();
      ctx.arc(w * 0.72, h * 0.62, 10 + Math.sin(pulse) * 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,180,160,${0.25 + c * 0.25})`;
      ctx.fill();
    }
  }

  function draw() {
    fit();
    const mod = MODULES[modIndex];
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    pulse += 0.016;
    const phase = currentPhase(mod, elapsed);
    const cue = currentCue(phase, elapsed);

    if (mod.kind === "ground-stairs") drawStairs(w, h, elapsed, phase);
    else if (mod.kind === "tense-release-discs") drawPMR(w, h, elapsed, phase);
    else if (mod.kind === "exhale-triangle") drawTriangle(w, h, elapsed, phase);
    else drawPortal(w, h, elapsed, phase);

    elPhase.textContent = `${mod.name}  ·  ${phase.name}`;
    elCue.textContent = cue.text;
    elMeta.textContent = `${fmt(elapsed)} / ${fmt(mod.durationSec)}  ·  协议钟  ·  脑电仅品质`;

    if (playing) {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      elapsed = Math.min(mod.durationSec, elapsed + dt * speed());
      if (elapsed >= mod.durationSec) playing = false;
    }
    requestAnimationFrame(draw);
  }

  function reset() {
    playing = false;
    elapsed = 0;
    document.getElementById("play").textContent = "播放";
    elCue.textContent = MODULES[modIndex].phases[0].cues[0]?.text || "准备";
  }

  document.getElementById("play").addEventListener("click", () => {
    playing = !playing;
    lastFrame = performance.now();
    document.getElementById("play").textContent = playing ? "暂停" : "播放";
  });
  document.getElementById("reset").addEventListener("click", reset);

  fit();
  draw();
})();
</script>
</body>
</html>
